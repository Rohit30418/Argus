services:
  - type: web
    name: argus-pro
    runtime: docker
    repo: https://github.com/Rohit30418/Argus.git
    branch: main
    plan: free
    region: singapore
    autoDeployTrigger: commit
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: ARGUS_HEADLESS
        value: "true"
      - key: ARGUS_BROWSER_NO_SANDBOX
        value: "true"
      - key: MAX_CONCURRENT_SCANS
        value: "1"
      - key: ARGUS_SCAN_RATE_LIMIT_PER_HOUR
        value: "10"
      - key: ARGUS_MAX_DISCOVERED_URLS
        value: "500"
      - key: ARGUS_MAX_LIGHT_PAGES
        value: "120"
      - key: ARGUS_MAX_DEEP_PAGES
        value: "20"
      - key: ARGUS_LIGHT_CONCURRENCY
        value: "3"
